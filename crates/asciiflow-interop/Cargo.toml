[package]
name = "asciiflow-interop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
av1-encode-diagnostic = ["asciiflow-media/av1-encode-diagnostic"]
p010-output-diagnostic = ["asciiflow-media/p010-output-diagnostic", "asciiflow-vulkan/p010-output-diagnostic"]

[dependencies]
asciiflow-core = { path = "../asciiflow-core" }
asciiflow-media = { path = "../asciiflow-media" }
asciiflow-vulkan = { path = "../asciiflow-vulkan" }
crossbeam-channel.workspace = true
ffmpeg-sys-next.workspace = true
libc = "0.2"
tracing.workspace = true

[dev-dependencies]
asciiflow-cpu = { path = "../asciiflow-cpu" }
asciiflow-font = { path = "../asciiflow-font" }
