name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native development dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libx264-dev libva-dev libdrm-dev libfreetype-dev spirv-tools
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: Validate generated SPIR-V
        run: find target/debug/build -path '*/out/ascii_*.spv' -print0 | xargs -0 -n1 spirv-val --target-env vulkan1.3
