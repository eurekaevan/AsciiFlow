name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native development dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang libclang-dev pkg-config nasm curl xz-utils libx264-dev libdav1d-dev libva-dev libdrm-dev libfreetype-dev spirv-tools
      - name: Build verified FFmpeg 8.1.3
        shell: bash
        run: |
          archive="$RUNNER_TEMP/ffmpeg-8.1.3.tar.xz"
          prefix="$RUNNER_TEMP/ffmpeg-install"
          curl --fail --location --output "$archive" https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz
          printf '%s  %s\n' 7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3 "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/ffmpeg-8.1.3"
          ./configure --prefix="$prefix" --libdir="$prefix/lib" \
            --enable-shared --disable-static --disable-programs --disable-doc --disable-autodetect \
            --disable-debug --disable-avdevice --disable-avfilter --disable-swresample \
            --enable-gpl --enable-libx264 --enable-libdav1d --enable-vaapi --enable-libdrm
          make -j"$(nproc)"
          make install
          printf 'FFMPEG_DIR=%s\n' "$prefix" >> "$GITHUB_ENV"
          printf 'PKG_CONFIG_PATH=%s/lib/pkgconfig%s\n' "$prefix" "${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s/lib%s\n' "$prefix" "${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: Validate generated SPIR-V
        run: find target/debug/build -path '*/out/ascii_*.spv' -print0 | xargs -0 -n1 spirv-val --target-env vulkan1.3
