[package]
name = "asciiflow-cli"
default-run = "asciiflow"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
gui = ["dep:eframe", "dep:rfd", "dep:winit"]
lgpl-prebuilt = ["asciiflow-media/lgpl-prebuilt"]
native-reliability = ["reliability-measurement", "asciiflow-core/native-reliability", "asciiflow-media/native-reliability", "asciiflow-vulkan/native-reliability", "asciiflow-interop/native-reliability"]
reliability-measurement = ["asciiflow-core/reliability-measurement", "asciiflow-media/reliability-measurement", "asciiflow-vulkan/reliability-measurement", "asciiflow-interop/reliability-measurement"]
encode-characterization = ["asciiflow-media/encode-characterization"]
mux-qualification = ["asciiflow-media/mux-qualification"]

[[bin]]
name = "asciiflow"
path = "src/main.rs"

[[bin]]
name = "asciiflow-gui"
path = "src/gui.rs"
required-features = ["gui"]

[dependencies]
asciiflow-font = { path = "../../crates/asciiflow-font" }
anyhow.workspace = true
asciiflow-core = { path = "../../crates/asciiflow-core" }
asciiflow-cpu = { path = "../../crates/asciiflow-cpu" }
asciiflow-media = { path = "../../crates/asciiflow-media" }
asciiflow-vulkan = { path = "../../crates/asciiflow-vulkan" }
clap.workspace = true
ctrlc.workspace = true
ffmpeg-sys-next.workspace = true
indicatif = { version = "0.18", default-features = false }
serde_json = "1.0"
tracing-subscriber.workspace = true
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
rfd = { version = "=0.15.4", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[dev-dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
asciiflow-interop = { path = "../../crates/asciiflow-interop", features = ["hdr-to-sdr-production"] }

# Use the already locked window backend to select XWayland for file drops.
[target.'cfg(target_os = "linux")'.dependencies.winit]
version = "=0.30.13"
optional = true
default-features = false
features = ["x11"]
